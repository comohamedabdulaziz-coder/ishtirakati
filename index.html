<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sub-Hub">
<meta name="theme-color" content="#131B27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="subhub-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="subhub-192.png">
<title>اشتراكاتي</title>
<style>
:root{
  /* Layout: one phone column. Navy totals band on top, tabs under it, list or stats below; add and settings sheets slide up from the bottom. */
  --bg:#EDF0F4;
  --surface:#FFFFFF;
  --ink:#131B27;
  --muted:#5B6677;
  --line:#D8DEE7;
  --accent:#2446D8;
  --accent-soft:#E3E8FC;
  --on-accent:#FFFFFF;
  --band:#131B27;
  --band-ink:#F3F5F9;
  --band-muted:#A8B3C4;
  --crit:#C0293A; --crit-soft:#FCE4E7;
  --warn:#A35C00; --warn-soft:#FFEFD6;
  --ok:#1F7A55; --ok-soft:#E0F2EA;
  --font-display:-apple-system,"SF Arabic","SF Pro Display","Geeza Pro","Segoe UI",Roboto,Tahoma,sans-serif;
  --font-body:-apple-system,"SF Arabic","SF Pro Text","Geeza Pro","Segoe UI",Roboto,Tahoma,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#161D28; --ink:#E7ECF3; --muted:#95A2B4; --line:#273143;
    --accent:#8099FF; --accent-soft:#1F2A4A; --on-accent:#0E131B;
    --band:#1C2636; --band-ink:#F3F5F9; --band-muted:#9FAABD;
    --crit:#FF7D89; --crit-soft:#3A1A20; --warn:#F2B04D; --warn-soft:#382A12; --ok:#5CCB9A; --ok-soft:#14302A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --ink:#E7ECF3; --muted:#95A2B4; --line:#273143;
  --accent:#8099FF; --accent-soft:#1F2A4A; --on-accent:#0E131B;
  --band:#1C2636; --band-ink:#F3F5F9; --band-muted:#9FAABD;
  --crit:#FF7D89; --crit-soft:#3A1A20; --warn:#F2B04D; --warn-soft:#382A12; --ok:#5CCB9A; --ok-soft:#14302A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* Header band */
.band{background:var(--band);color:var(--band-ink);padding:calc(12px + env(safe-area-inset-top)) 0 20px;border-radius:0 0 22px 22px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:21px;margin:0}
.hbtns{display:flex;gap:8px}
.hb{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:var(--band-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;padding:0}
.hb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:13px;color:var(--band-muted)}
.big{font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.yr{font-size:13px;color:var(--band-muted);margin-top:4px}
.tot{margin-top:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--band-muted);display:block}
.stat .v{font-weight:600;font-size:15px;display:block;overflow-wrap:anywhere}

/* Banners */
.banner{margin:14px 0 0;padding:12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.banner.err{background:var(--crit-soft);color:var(--crit)}
.banner button{flex:none;border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:4px 12px;font-weight:600;font-size:13px}

/* Tabs */
.tabs{display:flex;gap:4px;margin:18px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* Groups and cards */
.group{margin-top:18px}
.group h2{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.list{display:grid;gap:8px}
.sub{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--stripe,var(--line));border-radius:var(--r);padding:12px}
.sub.crit{--stripe:var(--crit)}
.sub.warn{--stripe:var(--warn)}
.sub.ok{--stripe:var(--ok)}
.sub.off{opacity:.6}
.when{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;padding:6px 0;line-height:1.1}
.when .d{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.when .m{font-size:12px;color:var(--muted);margin-top:2px}
.body{display:flex;flex-direction:column;gap:6px;min-width:0}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.amt{font-weight:600;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.r2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.r3{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pill{font-weight:600;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.chip{border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink);overflow-wrap:anywhere}

/* Payment-method groups and stats cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mname{font-family:var(--font-display);font-weight:600;font-size:16px;overflow-wrap:anywhere}
.mcount{font-size:13px;color:var(--muted)}
.msum{text-align:end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.msum small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mrow{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:start;padding:10px 14px;font-size:15px}
.mhead+.mrow{border-top:0}
.mrow .s{color:var(--muted);font-size:13px;white-space:nowrap}
.srows{padding:6px 14px 12px}
.srow{padding-top:10px}
.slabel{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.slabel .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.slabel .v small{font-weight:400;color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--bg);margin-top:6px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.peak{background:var(--warn)}
.srow.zero .slabel{color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin:8px 2px 0}

/* Empty state */
.empty{margin-top:18px}
.empty p{margin:0 0 12px;color:var(--muted)}
.example{position:relative;pointer-events:none}
.example .tag{position:absolute;top:-8px;inset-inline-end:10px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;z-index:1}

/* Bottom action */
.dock{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.primary{display:block;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;padding:14px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .22s ease}
.scrim.open .sheet{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.shead h2{font-family:var(--font-display);font-size:19px;margin:0}
.x{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field>label,.seg legend,.sec h3{font-size:14px;font-weight:600}
.field input,.field select,.inrow input{width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.field input:focus,.field select:focus,.inrow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.seg{border:0;padding:0;margin:14px 0 0;min-width:0}
.seg legend{margin-bottom:6px;padding:0}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs input{position:absolute;opacity:0;pointer-events:none}
.segs label,.segbtn{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;background:var(--bg);cursor:pointer}
.segs input:checked+label,.segbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.segs input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--crit);font-size:14px;margin:12px 0 0}
.err:empty{display:none}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .primary{flex:1}
.danger{border:1px solid var(--crit);color:var(--crit);background:transparent;border-radius:14px;padding:0 16px;font-weight:600}
.danger[data-armed="1"]{background:var(--crit);color:#fff}
.sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:4px;margin-top:8px}
.sec h3{margin:0 0 8px}
.sec .hint{margin-bottom:10px}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px;width:100%;text-align:center}
.stack{display:grid;gap:8px}
.inrow{display:flex;gap:8px;margin-top:10px}
.inrow button{flex:none;border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:0 16px;font-weight:600}
.catlist{display:flex;flex-wrap:wrap;gap:6px}
.catchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;background:var(--bg)}
[dir="rtl"] .catchip{padding:4px 12px 4px 6px}
.catchip.fixed{padding:4px 12px;color:var(--muted)}
.catchip button{border:0;background:var(--surface);width:24px;height:24px;border-radius:50%;font-size:15px;line-height:1;padding:0}
.confirm{margin-top:10px;padding:12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.confirm .row{display:flex;gap:8px;margin-top:10px}
.confirm button{border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.confirm .yes{background:var(--warn);color:#fff}
.confirm .no{background:var(--surface);color:var(--ink)}
textarea.copy{width:100%;min-height:150px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:14px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.scrim,.sheet,.toast{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="bar">
      <h1 data-t="appName">اشتراكاتي</h1>
      <div class="hbtns">
        <button type="button" class="hb" id="langBtn">EN</button>
        <button type="button" class="hb" id="themeBtn"></button>
        <button type="button" class="hb" id="moreBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      </div>
    </div>
    <section class="tot" id="totals" aria-live="polite"></section>
  </div>
</header>

<div class="wrap">
  <div class="banner err" id="storeWarn" hidden></div>
  <div class="banner" id="installTip" hidden><span id="installText"></span><button type="button" id="tipOk"></button></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-upcoming" data-view="upcoming" data-t="tabUpcoming" aria-selected="true"></button>
    <button type="button" role="tab" id="tab-methods" data-view="methods" data-t="tabMethods" aria-selected="false"></button>
    <button type="button" role="tab" id="tab-stats" data-view="stats" data-t="tabStats" aria-selected="false"></button>
  </div>
  <main id="list"></main>
</div>

<div class="dock"><button type="button" class="primary" id="addBtn" data-t="add"></button></div>

<!-- Add / edit sheet -->
<div class="scrim" id="editScrim" hidden>
  <form class="sheet" id="form" novalidate role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip"></div>
    <div class="shead">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="x" data-close="editScrim" data-ta="close">×</button>
    </div>
    <div class="field">
      <label for="f-name" data-t="fName"></label>
      <input id="f-name" list="dl-names" autocomplete="off" data-tp="phName">
    </div>
    <div class="field">
      <label for="f-amount" data-t="fAmount"></label>
      <input id="f-amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0">
    </div>
    <fieldset class="seg">
      <legend data-t="fCycle"></legend>
      <div class="segs" id="f-cycle"></div>
    </fieldset>
    <div class="field">
      <label for="f-date" data-t="fDate"></label>
      <input id="f-date" type="date">
      <p class="hint" data-t="hDate"></p>
    </div>
    <div class="field">
      <label for="f-cat" data-t="fCat"></label>
      <select id="f-cat"></select>
      <input id="f-newcat" autocomplete="off" data-tp="phNewCat" hidden>
    </div>
    <div class="field">
      <label for="f-method" data-t="fMethod"></label>
      <input id="f-method" list="dl-methods" autocomplete="off" data-tp="phMethod">
      <p class="hint" data-t="hMethod"></p>
    </div>
    <div class="field">
      <label for="f-account" data-t="fAccount"></label>
      <input id="f-account" autocomplete="off" data-tp="phAccount">
    </div>
    <div class="field">
      <label for="f-note" data-t="fNote"></label>
      <input id="f-note" autocomplete="off" data-tp="phNote">
    </div>
    <label class="toggle" for="f-active"><input type="checkbox" id="f-active" checked> <span data-t="fActive"></span></label>
    <p class="err" id="formErr" role="alert"></p>
    <div class="actions">
      <button type="submit" class="primary" data-t="save"></button>
      <button type="button" class="danger" id="delBtn" hidden></button>
    </div>
  </form>
</div>

<!-- Settings sheet -->
<div class="scrim" id="setScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="grip"></div>
    <div class="shead">
      <h2 id="setTitle" data-t="settings"></h2>
      <button type="button" class="x" data-close="setScrim" data-ta="close">×</button>
    </div>
    <section class="sec">
      <h3 data-t="sLang"></h3>
      <div class="segs"><button type="button" class="segbtn" data-lang="ar">العربية</button><button type="button" class="segbtn" data-lang="en">English</button></div>
    </section>
    <section class="sec">
      <h3 data-t="sTheme"></h3>
      <div class="segs"><button type="button" class="segbtn" data-theme-set="light" data-t="light"></button><button type="button" class="segbtn" data-theme-set="dark" data-t="dark"></button><button type="button" class="segbtn" data-theme-set="auto" data-t="auto"></button></div>
    </section>
    <section class="sec">
      <h3 data-t="sCats"></h3>
      <p class="hint" data-t="sCatsHint"></p>
      <div class="catlist" id="catList"></div>
      <div class="inrow"><input id="newCatInput" autocomplete="off" data-tp="phNewCat" aria-label="category"><button type="button" id="addCatBtn" data-t="addCat"></button></div>
    </section>
    <section class="sec">
      <h3 data-t="sBackup"></h3>
      <p class="hint" data-t="sBackupHint"></p>
      <div class="stack">
        <button type="button" class="ghost" id="exportBtn" data-t="exportBtn"></button>
        <button type="button" class="ghost" id="importBtn" data-t="importBtn"></button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <div class="confirm" id="importConfirm" hidden>
        <span id="importMsg"></span>
        <div class="row"><button type="button" class="yes" id="importYes" data-t="importYes"></button><button type="button" class="no" id="importNo" data-t="importNo"></button></div>
      </div>
    </section>
    <section class="sec">
      <button type="button" class="ghost" id="copyBtn" data-t="copyBtn"></button>
      <div id="copyBox" hidden><p class="hint" data-t="copyFail" style="margin-top:10px"></p><textarea class="copy" id="copyText" readonly aria-label="text"></textarea></div>
    </section>
  </div>
</div>

<datalist id="dl-names"></datalist>
<datalist id="dl-methods"></datalist>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";

var LS = {data:"ishtirakati.data.v1", lang:"ishtirakati.lang", theme:"ishtirakati.theme", tip:"ishtirakati.tip"};
var DEFAULT_CATS = ["ent","work","tel","edu","health","other"];
var CYCLES = {w1:{u:"w",n:1}, m1:{u:"m",n:1}, m3:{u:"m",n:3}, m6:{u:"m",n:6}, y1:{u:"y",n:1}};
var CYCLE_ORDER = ["m1","y1","m3","m6","w1"];
var NAME_SUGGEST = ["Netflix","Shahid VIP","Watch It","OSN+","Spotify","Anghami","YouTube Premium","Apple Music","iCloud+","Google One","Claude","ChatGPT Plus","Microsoft 365","Canva Pro","باقة النت المنزلي","باقة الموبايل","الجيم"];
var METHOD_SUGGEST = ["فيزا","ماستركارد","ميزة","InstaPay","فودافون كاش","Apple (App Store)","Google Play","فوري","كاش","رصيد الموبايل"];

var T = {
  ar: {
    appName:"اشتراكاتي",
    perMonth:"بتدفع في الشهر تقريبًا",
    perYear:function(v){ return "يعني حوالي "+v+" في السنة"; },
    due30:"مستحق خلال 30 يوم", nextUp:"أقرب تجديد", none:"مفيش",
    tabUpcoming:"المواعيد", tabMethods:"طرق الدفع", tabStats:"إحصائيات",
    add:"+ ضيف اشتراك",
    gWeek:"خلال أسبوع", gMonth:"خلال الشهر", gLater:"بعد كده", gPaused:"متوقفة",

  FMT.mon = new Intl.DateTimeFormat(loc,{month: state.lang==="en" ? "short" : "long"});

  FMT.monYear = new Intl.DateTimeFormat(loc,{month:"long", year:"numeric"});
}

/* ---------- storage ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
var storageOK = (function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } })();

var state = {items:[], cats:[], lang: lsGet(LS.lang)==="en" ? "en" : "ar", theme: lsGet(LS.theme), view:"upcoming", editing:null, pendingImport:null};
if(state.theme!=="light" && state.theme!=="dark") state.theme=null;
function L(){ return T[state.lang]; }

function newId(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function cleanItem(x){
  if(!x || typeof x!=="object") return null;
  var name=String(x.name||"").trim().slice(0,80), amount=Number(x.amount), date=String(x.date||"");
  if(!name || !(amount>=0) || !parseISO(date)) return null;
  return {
    id:String(x.id||newId()).slice(0,40), name:name, amount:Math.round(amount*100)/100,
    cycle:CYCLES[x.cycle] ? x.cycle : "m1", date:date,
    method:String(x.method||"").trim().slice(0,60),
    category:(typeof x.category==="string" && x.category) ? x.category.slice(0,62) : "other",
    account:String(x.account||"").trim().slice(0,80),
    note:String(x.note||"").trim().slice(0,140),
    active:x.active!==false,
    createdAt:Number(x.createdAt)||Date.now(), updatedAt:Number(x.updatedAt)||Date.now()
  };
}
function cleanCats(list){
  var seen={}, out=[];
  (Array.isArray(list)?list:[]).forEach(function(c){ var s=String(c||"").trim().slice(0,30); if(s && !seen[s.toLowerCase()]){ seen[s.toLowerCase()]=1; out.push(s); } });
  return out.slice(0,40);
}
function adopt(data){
  var items=(Array.isArray(data.items)?data.items:[]).map(cleanItem).filter(Boolean);
  var cats=cleanCats(data.cats);
  items.forEach(function(i){
    if(i.category.indexOf("c:")===0){ var n=i.category.slice(2); if(cats.map(function(c){return c.toLowerCase();}).indexOf(n.toLowerCase())<0) cats.push(n); }
    else if(DEFAULT_CATS.indexOf(i.category)<0) i.category="other";
  });
  state.items=items; state.cats=cats;
}
function loadData(){
  var raw=lsGet(LS.data);
  if(!raw) return;
  try{ adopt(JSON.parse(raw)); }catch(e){}
}
function saveData(){
  var ok=lsSet(LS.data, JSON.stringify({app:"ishtirakati", v:1, items:state.items, cats:state.cats}));
  if(!ok) toast(L().saveFail);
  return ok;
}

/* ---------- dates ---------- */
function today0(){ var t=new Date(); t.setHours(0,0,0,0); return t; }
function parseISO(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); if(!m) return null; var d=new Date(+m[1], +m[2]-1, +m[3]); return isNaN(d) ? null : d; }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ var r=new Date(d.getTime()); r.setDate(r.getDate()+n); return r; }
function addMonthsClamp(a,k){
  var total=a.getMonth()+k, y=a.getFullYear()+Math.floor(total/12), m=((total%12)+12)%12;
  var last=new Date(y,m+1,0).getDate();
  return new Date(y,m,Math.min(a.getDate(),last));
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function cyc(it){ return CYCLES[it.cycle] || CYCLES.m1; }
function stepMonths(c){ return c.u==="y" ? 12*c.n : c.n; }
function dateAt(it,A,k){ var c=cyc(it); return c.u==="w" ? addDays(A,7*c.n*k) : addMonthsClamp(A,k*stepMonths(c)); }
function firstIndex(it,A,t){
  if(A>=t) return 0;
  var c=cyc(it), k;
  if(c.u==="w"){ k=Math.ceil(daysBetween(A,t)/(7*c.n)); }
  else { k=Math.max(0,Math.floor(((t.getFullYear()-A.getFullYear())*12 + t.getMonth()-A.getMonth())/stepMonths(c))); }
  while(dateAt(it,A,k)<t) k++;
  return k;
}
function nextDate(it,t){ var A=parseISO(it.date); return A ? dateAt(it,A,firstIndex(it,A,t)) : null; }
function countBetween(it,from,to){
  var A=parseISO(it.date); if(!A) return 0;
  var k=firstIndex(it,A,from), n=0;
  while(dateAt(it,A,k)<=to && n<60){ n++; k++; }
  return n;
}
function monthly(it){
  var a=Number(it.amount)||0, c=cyc(it);
  if(c.u==="w") return a*52/12/c.n;
  if(c.u==="y") return a/(12*c.n);
  return a/c.n;
}
function sev(it,d){ if(it.active===false) return "off"; if(d<=1) return "crit"; if(d<=7) return "warn"; return "ok"; }

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(v){ return L().money(NF.format(Math.round(v*100)/100)); }
function moneyRound(v){ return L().money(NF.format(Math.round(v))); }
function catLabel(k){
  if(DEFAULT_CATS.indexOf(k)>=0) return L().cats[k];
  if(String(k).indexOf("c:")===0) return k.slice(2);
  return L().cats.other;
}
function allCats(){ return DEFAULT_CATS.concat(state.cats.map(function(c){ return "c:"+c; })); }
function active(){ return state.items.filter(function(i){ return i.active!==false; }); }
function withDates(items,t){
  return items.map(function(i){ var d=nextDate(i,t); return {i:i, d:d, days:d?daysBetween(t,d):9999}; })
    .sort(function(a,b){ return a.days-b.days || String(a.i.name).localeCompare(String(b.i.name)); });
}
function methodKey(m){ return String(m||"").trim().replace(/\s+/g," ").toLowerCase(); }
function dayMon(d){ return state.lang==="en" ? d.getDate()+" "+FMT.mon.format(d) : d.getDate()+" "+FMT.mon.format(d); }

/* ---------- render ---------- */
function renderTotals(){
  var t=today0(), act=active(), perMonth=0, next30=0, lim=addDays(t,29);
  act.forEach(function(i){ perMonth+=monthly(i); next30+=countBetween(i,t,lim)*(Number(i.amount)||0); });
  var soon=withDates(act,t)[0];
  $("totals").innerHTML =
    '<div class="eyebrow">'+esc(L().perMonth)+'</div>'+
    '<div class="big"><bdi dir="auto">'+esc(moneyRound(perMonth))+'</bdi></div>'+
    (perMonth>0 ? '<div class="yr">'+esc(L().perYear(moneyRound(perMonth*12)))+'</div>' : '')+
    '<div class="stats">'+
      '<div class="stat"><span class="k">'+esc(L().due30)+'</span><span class="v num">'+(next30>0 ? '<bdi dir="auto">'+esc(money(next30))+'</bdi>' : esc(L().none))+'</span></div>'+
      '<div class="stat"><span class="k">'+esc(L().nextUp)+'</span><span class="v">'+(soon&&soon.d ? '<bdi dir="auto">'+esc(soon.i.name)+'</bdi> · '+esc(L().rel(soon.days)) : esc(L().none))+'</span></div>'+
    '</div>';
}

function card(x){
  var i=x.i, d=x.d, s=sev(i,x.days);
  var pill = i.active===false ? '<span class="pill">'+esc(L().paused)+'</span>' : '<span class="pill '+s+'">'+esc(L().rel(x.days))+'</span>';
  var r3=[esc(catLabel(i.category))]; if(i.account) r3.push('<bdi dir="auto">'+esc(i.account)+'</bdi>'); if(i.note) r3.push(esc(i.note));
  return '<button type="button" class="sub '+s+'" data-id="'+esc(i.id)+'">'+

      '<span class="r2">'+pill+'<span>'+esc(L().cycles[i.cycle]||L().cycles.m1)+'</span>'+(i.method?'<bdi dir="auto" class="chip">'+esc(i.method)+'</bdi>':'')+'</span>'+
      '<span class="r3">'+r3.join(" · ")+'</span>'+
    '</span></button>';
}

function renderUpcoming(){
  var t=today0(), all=withDates(state.items,t);
  var groups=[
    {k:"gWeek", f:function(x){ return x.i.active!==false && x.days<=7; }},
    {k:"gMonth", f:function(x){ return x.i.active!==false && x.days>7 && x.days<=30; }},
    {k:"gLater", f:function(x){ return x.i.active!==false && x.days>30; }},
    {k:"gPaused", f:function(x){ return x.i.active===false; }}
  ];
  return groups.map(function(g){
    var rows=all.filter(g.f); if(!rows.length) return "";
    var sum=0; rows.forEach(function(x){ if(x.i.active!==false) sum+=Number(x.i.amount)||0; });
    return '<section class="group"><h2><span>'+esc(L()[g.k])+'</span><span class="num">'+(sum?'<bdi dir="auto">'+esc(money(sum))+'</bdi>':'')+'</span></h2><div class="list">'+rows.map(card).join("")+'</div></section>';
  }).join("");
}

function renderMethods(){
  var t=today0(), groups={}, order=[];
  withDates(state.items,t).forEach(function(x){
    var key=methodKey(x.i.method)||"__none";
    if(!groups[key]){ groups[key]={label:(x.i.method||"").trim()||L().noMethod, rows:[]}; order.push(key); }
    groups[key].rows.push(x);
  });
  order.sort(function(a,b){ if(a==="__none") return 1; if(b==="__none") return -1; return groups[b].rows.length-groups[a].rows.length; });
  return order.map(function(k){
    var g=groups[k], pm=0;
    g.rows.forEach(function(x){ if(x.i.active!==false) pm+=monthly(x.i); });
    return '<section class="group"><div class="card">'+
      '<div class="mhead"><div><div class="mname"><bdi dir="auto">'+esc(g.label)+'</bdi></div><div class="mcount">'+esc(L().count(g.rows.length))+'</div></div>'+
      '<div class="msum"><bdi dir="auto">'+esc(moneyRound(pm))+'</bdi><small>'+esc(L().total)+'</small></div></div>'+
      g.rows.map(function(x){
        return '<button type="button" class="mrow" data-id="'+esc(x.i.id)+'"><span><bdi dir="auto">'+esc(x.i.name)+'</bdi> <span class="s">'+esc(money(Number(x.i.amount)||0))+' · '+esc(L().cycles[x.i.cycle]||"")+'</span></span>'+
          '<span class="s">'+(x.i.active===false ? esc(L().paused) : (x.d ? esc(dayMon(x.d)) : ""))+'</span></button>';
      }).join("")+
    '</div></section>';
  }).join("");
}

function renderStats(){
  var act=active();
  if(!act.length) return '<p class="foot" style="margin-top:22px">'+esc(L().statsEmpty)+'</p>';
  // by category
  var byCat={}, total=0;
  act.forEach(function(i){ var m=monthly(i); byCat[i.category]=(byCat[i.category]||0)+m; total+=m; });
  var cats=Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
  var maxC=byCat[cats[0]]||1;
  var catHTML=cats.map(function(k){
    var v=byCat[k], pct=total?Math.round(v/total*100):0;
    return '<div class="srow"><div class="slabel"><span>'+esc(catLabel(k))+'</span><span class="v"><bdi dir="auto">'+esc(moneyRound(v))+'</bdi> <small>· '+pct+'%</small></span></div>'+
      '<div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(v/maxC*100))+'%"></div></div></div>';
  }).join("");
  // month by month
  var t=today0(), months=[], sum=0, peakIx=0;
  for(var m=0;m<12;m++){
    var start=new Date(t.getFullYear(), t.getMonth()+m, 1), end=new Date(start.getFullYear(), start.getMonth()+1, 0);
    var from = m===0 ? t : start, v=0;
    act.forEach(function(i){ v+=countBetween(i,from,end)*(Number(i.amount)||0); });
    months.push({d:start, v:v, cur:m===0}); sum+=v;
    if(v>months[peakIx].v) peakIx=m;
  }
  var maxM=months[peakIx].v||1;
  var monHTML=months.map(function(x,ix){
    var label=FMT.monYear.format(x.d)+(x.cur?" "+L().rest:"");
    return '<div class="srow'+(x.v?'':' zero')+'"><div class="slabel"><span>'+esc(label)+'</span><span class="v"><bdi dir="auto">'+esc(moneyRound(x.v))+'</bdi></span></div>'+
      '<div class="track"><div class="fill'+(ix===peakIx&&x.v?' peak':'')+'" style="width:'+(x.v?Math.max(2,Math.round(x.v/maxM*100)):0)+'%"></div></div></div>';
  }).join("");
  var peak=months[peakIx];
  return '<section class="group"><h2><span>'+esc(L().byCat)+'</span><span>'+esc(L().byCatSub)+'</span></h2><div class="card srows">'+catHTML+'</div></section>'+
    '<section class="group"><h2><span>'+esc(L().byMonth)+'</span><span>'+esc(L().byMonthSub)+'</span></h2><div class="card srows">'+monHTML+'</div>'+
    '<p class="foot">'+esc(L().avg(moneyRound(sum/12)))+(peak.v?' · '+esc(L().peak(FMT.monYear.format(peak.d), moneyRound(peak.v))):'')+'</p></section>';
}

function renderEmpty(){
  var t=today0();
  var ex=[
    {i:{id:"ex1",name:"Netflix",amount:240,cycle:"m1",method:state.lang==="en"?"Visa 4417":"فيزا 4417",category:"ent",date:toISO(addDays(t,2))}},
    {i:{id:"ex2",name:state.lang==="en"?"Home internet":"باقة النت المنزلي",amount:450,cycle:"m1",method:"InstaPay",category:"tel",date:toISO(addDays(t,12))}}
  ].map(function(x){ x.d=nextDate(x.i,t); x.days=daysBetween(t,x.d); return x; });
  return '<div class="empty"><p>'+esc(L().emptyLead)+'</p><div class="list">'+
    ex.map(function(x){ return '<div class="example" aria-hidden="true"><span class="tag">'+esc(L().example)+'</span>'+card(x).replace('<button type="button"','<div').replace(/<\/button>$/,'</div>')+'</div>'; }).join("")+
    '</div></div>';
}

function render(){
  renderTotals();
  var Lst=$("list");
  if(!state.items.length && state.view!=="stats") Lst.innerHTML=renderEmpty();
  else if(state.view==="methods") Lst.innerHTML=renderMethods();
  else if(state.view==="stats") Lst.innerHTML=renderStats();
  else Lst.innerHTML=renderUpcoming();
  ["upcoming","methods","stats"].forEach(function(v){ $("tab-"+v).setAttribute("aria-selected", String(state.view===v)); });
  fillDatalists();
}

function fillDatalists(){
  var seen={}, names=[], methods=[];
  state.items.forEach(function(i){ var k=methodKey(i.method); if(k && !seen[k]){ seen[k]=1; methods.push(i.method.trim()); } });
  METHOD_SUGGEST.forEach(function(m){ var k=methodKey(m); if(!seen[k]){ seen[k]=1; methods.push(m); } });
  var have={}; state.items.forEach(function(i){ have[String(i.name).toLowerCase()]=1; });
  NAME_SUGGEST.forEach(function(n){ if(!have[n.toLowerCase()]) names.push(n); });
  $("dl-methods").innerHTML=methods.map(function(m){ return '<option value="'+esc(m)+'"></option>'; }).join("");
  $("dl-names").innerHTML=names.map(function(m){ return '<option value="'+esc(m)+'"></option>'; }).join("");
}

/* ---------- language and theme ---------- */
var ICON_MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
var ICON_SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
function isDark(){ if(state.theme==="dark") return true; if(state.theme==="light") return false; try{ return matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ return false; } }
function applyTheme(){
  var r=document.documentElement;
  if(state.theme) r.setAttribute("data-theme",state.theme); else r.removeAttribute("data-theme");
  $("themeBtn").innerHTML = isDark() ? ICON_SUN : ICON_MOON;
  document.querySelectorAll("[data-theme-set]").forEach(function(b){ b.setAttribute("aria-pressed", String((b.getAttribute("data-theme-set"))===(state.theme||"auto"))); });
}
function setTheme(v){ state.theme = v==="auto" ? null : v; if(state.theme) lsSet(LS.theme,state.theme); else { try{ localStorage.removeItem(LS.theme); }catch(e){} } applyTheme(); }

function applyLang(){
  var r=document.documentElement, l=L();
  r.lang=state.lang; r.dir = state.lang==="en" ? "ltr" : "rtl";
  document.title=l.appName;
  document.querySelectorAll("[data-t]").forEach(function(el){ var v=l[el.getAttribute("data-t")]; if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll("[data-tp]").forEach(function(el){ var v=l[el.getAttribute("data-tp")]; if(typeof v==="string") el.setAttribute("placeholder",v); });
  document.querySelectorAll("[data-ta]").forEach(function(el){ var v=l[el.getAttribute("data-ta")]; if(typeof v==="string") el.setAttribute("aria-label",v); });
  $("langBtn").textContent = state.lang==="en" ? "ع" : "EN";
  $("langBtn").setAttribute("aria-label", l.langAria);
  $("themeBtn").setAttribute("aria-label", l.themeAria);
  $("moreBtn").setAttribute("aria-label", l.moreAria);
  $("tipOk").textContent=l.ok;
  $("installText").textContent = isIOS() ? l.tipIOS : l.tipOther;
  $("storeWarn").textContent=l.storeWarn;
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-lang")===state.lang)); });
  $("f-cycle").innerHTML=CYCLE_ORDER.map(function(k){ return '<input type="radio" name="cycle" id="cy-'+k+'" value="'+k+'"><label for="cy-'+k+'">'+esc(l.cycles[k])+'</label>'; }).join("");
  fmts();
}
function setLang(v){ state.lang = v==="en" ? "en" : "ar"; lsSet(LS.lang,state.lang); applyLang(); render(); renderCatList(); }

/* ---------- sheets ---------- */
var lastFocus=null;
function openScrim(id){
  lastFocus=document.activeElement;
  var s=$(id); s.hidden=false;
  requestAnimationFrame(function(){ s.classList.add("open"); });
}
function closeScrim(id){
  var s=$(id); if(s.hidden) return;
  s.classList.remove("open");
  setTimeout(function(){ s.hidden=true; },200);
  if(id==="editScrim") state.editing=null;
  if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
}
function fillCatSelect(sel){
  var l=L();
  $("f-cat").innerHTML = allCats().map(function(k){ return '<option value="'+esc(k)+'">'+esc(catLabel(k))+'</option>'; }).join("") +
    '<option value="__new">'+esc(l.newCatOpt)+'</option>';
  $("f-cat").value = allCats().indexOf(sel)>=0 ? sel : "other";
  $("f-newcat").hidden=true; $("f-newcat").value="";
}
function openEdit(item){
  var l=L();
  state.editing=item?item.id:null;
  $("sheetTitle").textContent=item?l.editSub:l.newSub;
  $("f-name").value=item?item.name:"";
  $("f-amount").value=item?item.amount:"";
  var cy=item&&CYCLES[item.cycle]?item.cycle:"m1"; $("cy-"+cy).checked=true;
  var t=today0(), nd=item?nextDate(item,t):null;
  $("f-date").value=nd?toISO(nd):toISO(t);
  fillCatSelect(item?item.category:"ent");
  $("f-method").value=item?item.method:"";
  $("f-account").value=item?item.account:"";
  $("f-note").value=item?item.note:"";
  $("f-active").checked=item?item.active!==false:true;
  $("formErr").textContent="";
  var del=$("delBtn"); del.hidden=!item; del.removeAttribute("data-armed"); del.textContent=l.del;
  openScrim("editScrim");
  if(!item) setTimeout(function(){ $("f-name").focus(); },80);
}
function looksLikeCard(s){ var digits=String(s||"").replace(/[^\d]/g,""); return /\d[\d\s-]{10,}\d/.test(s||"") && digits.length>=12; }

function addCustomCat(name){
  var n=String(name||"").trim().slice(0,30);
  if(!n) return null;
  var lower=state.cats.map(function(c){ return c.toLowerCase(); });
  var ix=lower.indexOf(n.toLowerCase());
  if(ix>=0) return "c:"+state.cats[ix];
  var dflt=DEFAULT_CATS.filter(function(k){ return T.ar.cats[k].toLowerCase()===n.toLowerCase() || T.en.cats[k].toLowerCase()===n.toLowerCase(); })[0];
  if(dflt) return dflt;
  state.cats.push(n);
  return "c:"+n;
}

function readForm(){
  var l=L(), name=$("f-name").value.trim(), amount=parseFloat(String($("f-amount").value).replace(",",".")), date=$("f-date").value, method=$("f-method").value.trim();
  var cyEl=document.querySelector('input[name="cycle"]:checked');
  if(!name) return {err:l.errName, focus:"f-name"};
  if(!(amount>0)) return {err:l.errAmount, focus:"f-amount"};
  if(!parseISO(date)) return {err:l.errDate, focus:"f-date"};
  if(looksLikeCard(method)) return {err:l.errCard, focus:"f-method"};
  var cat=$("f-cat").value;
  if(cat==="__new"){
    if(!$("f-newcat").value.trim()) return {err:l.errCat, focus:"f-newcat"};
    cat={pending:$("f-newcat").value};
  }
  if(looksLikeCard($("f-note").value) || looksLikeCard($("f-account").value)) return {err:l.errCard, focus:"f-note"};
  return {body:{name:name.slice(0,80), amount:Math.round(amount*100)/100, cycle:cyEl?cyEl.value:"m1", date:date,
    method:method.slice(0,60), category:cat, account:$("f-account").value.trim().slice(0,80),
    note:$("f-note").value.trim().slice(0,140), active:$("f-active").checked}};
}

/* ---------- settings ---------- */
function renderCatList(){
  var l=L();
  $("catList").innerHTML =
    DEFAULT_CATS.map(function(k){ return '<span class="catchip fixed">'+esc(l.cats[k])+'</span>'; }).join("") +
    state.cats.map(function(c){ return '<span class="catchip"><bdi dir="auto">'+esc(c)+'</bdi><button type="button" data-delcat="'+esc(c)+'" aria-label="'+esc(l.del+" "+c)+'">×</button></span>'; }).join("");
}
function asText(){
  var t=today0(), rows=withDates(state.items,t), l=L();
  if(!rows.length) return "";
  var lines=[l.appName+" — "+FMT.full.format(t),""];
  rows.forEach(function(x){
    var i=x.i;
    lines.push("• "+i.name+" — "+money(Number(i.amount)||0)+" "+(l.cycles[i.cycle]||"")+
      (i.active===false ? " — "+l.paused : " — "+l.renew+" "+(x.d?FMT.full.format(x.d):""))+
      (i.method?" — "+i.method:"")+" — "+catLabel(i.category)+(i.account?" — "+i.account:"")+(i.note?" ("+i.note+")":""));
  });
  var pm=0; active().forEach(function(i){ pm+=monthly(i); });
  lines.push("", l.perMonth+": "+moneyRound(pm));
  return lines.join("\n");
}
function exportBackup(){
  var data=JSON.stringify({app:"ishtirakati", v:1, exportedAt:new Date().toISOString(), items:state.items, cats:state.cats}, null, 1);
  var name="ishtirakati-backup-"+toISO(today0())+".json", file=null;
  try{ file=new File([data], name, {type:"application/json"}); }catch(e){}
  if(file && navigator.canShare && navigator.share){
    try{ if(navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(function(){}); return; } }catch(e){}
  }
  var url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
}

var toastT=null;
function toast(msg){ var el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove("show"); },2600); }
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function isStandalone(){ try{ return navigator.standalone===true || matchMedia("(display-mode: standalone)").matches; }catch(e){ return false; } }

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-id]");
  if(b){
    var id=b.getAttribute("data-id"), it=null;
    state.items.forEach(function(x){ if(x.id===id) it=x; });
    if(it) openEdit(it);
    return;
  }
  var c=e.target.closest("[data-close]");
  if(c){ closeScrim(c.getAttribute("data-close")); return; }
  var dc=e.target.closest("[data-delcat]");
  if(dc){
    var name=dc.getAttribute("data-delcat"), key="c:"+name;
    if(state.items.some(function(i){ return i.category===key; })){ toast(L().catInUse); return; }
    state.cats=state.cats.filter(function(x){ return x!==name; }); saveData(); renderCatList(); return;
  }
  var lb=e.target.closest("[data-lang]"); if(lb){ setLang(lb.getAttribute("data-lang")); return; }
  var tb=e.target.closest("[data-theme-set]"); if(tb){ setTheme(tb.getAttribute("data-theme-set")); return; }
});
document.querySelectorAll(".tabs button").forEach(function(btn){
  btn.addEventListener("click",function(){ state.view=btn.getAttribute("data-view"); render(); window.scrollTo(0,0); });
});
["editScrim","setScrim"].forEach(function(id){ $(id).addEventListener("click",function(e){ if(e.target===$(id)) closeScrim(id); }); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeScrim("editScrim"); closeScrim("setScrim"); } });

$("addBtn").addEventListener("click",function(){ openEdit(null); });
$("langBtn").addEventListener("click",function(){ setLang(state.lang==="en"?"ar":"en"); });
$("themeBtn").addEventListener("click",function(){ setTheme(isDark()?"light":"dark"); });
$("moreBtn").addEventListener("click",function(){ renderCatList(); $("importConfirm").hidden=true; $("copyBox").hidden=true; openScrim("setScrim"); });
$("tipOk").addEventListener("click",function(){ $("installTip").hidden=true; lsSet(LS.tip,"1"); });
$("f-cat").addEventListener("change",function(){ var n=$("f-cat").value==="__new"; $("f-newcat").hidden=!n; if(n) $("f-newcat").focus(); });

$("form").addEventListener("submit",function(e){
  e.preventDefault();
  var r=readForm();
  if(r.err){ $("formErr").textContent=r.err; var f=$(r.focus); if(f) f.focus(); return; }
  var body=r.body;
  if(typeof body.category==="object") body.category=addCustomCat(body.category.pending)||"other";
  var id=state.editing, prev=null;
  state.items.forEach(function(x){ if(x.id===id) prev=x; });
  var rec=Object.assign({id:id||newId(), createdAt:prev?prev.createdAt:Date.now(), updatedAt:Date.now()}, body);
  if(prev) state.items=state.items.map(function(x){ return x.id===id ? rec : x; }); else state.items.push(rec);
  closeScrim("editScrim");
  if(saveData()) toast(prev ? L().savedMsg : L().added(rec.name));
  render();
});
$("delBtn").addEventListener("click",function(){
  var b=$("delBtn");
  if(b.getAttribute("data-armed")!=="1"){ b.setAttribute("data-armed","1"); b.textContent=L().delConfirm; return; }
  var id=state.editing, name="";
  state.items.forEach(function(x){ if(x.id===id) name=x.name; });
  state.items=state.items.filter(function(x){ return x.id!==id; });
  closeScrim("editScrim");
  if(saveData()) toast(L().deleted(name));
  render();
});
$("addCatBtn").addEventListener("click",function(){
  var v=$("newCatInput").value.trim(); if(!v) { $("newCatInput").focus(); return; }
  var before=state.cats.length, k=addCustomCat(v);
  if(state.cats.length===before && k){ toast(L().catExists); }
  $("newCatInput").value=""; saveData(); renderCatList();
});
$("newCatInput").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); $("addCatBtn").click(); } });
$("exportBtn").addEventListener("click",exportBackup);
$("importBtn").addEventListener("click",function(){ $("importFile").value=""; $("importFile").click(); });
$("importFile").addEventListener("change",function(){
  var f=$("importFile").files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d || d.app!=="ishtirakati" || !Array.isArray(d.items)) throw 0;
      state.pendingImport=d;
      var m=d.items.map(cleanItem).filter(Boolean).length;
      $("importMsg").textContent=L().importAsk(state.items.length,m);
      $("importConfirm").hidden=false;
    }catch(err){ toast(L().importBad); }
  };
  rd.onerror=function(){ toast(L().importBad); };
  rd.readAsText(f);
});
$("importYes").addEventListener("click",function(){
  var d=state.pendingImport; if(!d) return;
  adopt(d); state.pendingImport=null; $("importConfirm").hidden=true;
  if(saveData()) toast(L().imported(state.items.length));
  render(); renderCatList();
});
$("importNo").addEventListener("click",function(){ state.pendingImport=null; $("importConfirm").hidden=true; });
$("copyBtn").addEventListener("click",function(){
  var txt=asText();
  if(!txt){ toast(L().nothing); return; }
  var show=function(){ $("copyBox").hidden=false; $("copyText").value=txt; $("copyText").focus(); $("copyText").select(); };
  try{ navigator.clipboard.writeText(txt).then(function(){ $("copyBox").hidden=true; toast(L().copied); }, show); }catch(err){ show(); }
});
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme); }catch(e){}
document.addEventListener("visibilitychange",function(){ if(!document.hidden) render(); });

/* ---------- start ---------- */
loadData();
applyLang();
applyTheme();
render();
if(!storageOK) $("storeWarn").hidden=false;
if(!isStandalone() && lsGet(LS.tip)!=="1" && /Mobi|iPhone|iPad|Android/.test(navigator.userAgent)) $("installTip").hidden=false;
if(navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist().catch(function(){}); }catch(e){} }
if("serviceWorker" in navigator && location.protocol!=="file:"){ navigator.serviceWorker.register("sw.js").then(function(r){ try{ r.update(); }catch(e){} }).catch(function(){}); }
})();
</script>
